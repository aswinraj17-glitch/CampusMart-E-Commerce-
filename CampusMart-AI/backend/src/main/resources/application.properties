server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusmart?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campusmart}
spring.datasource.password=${DB_PASSWORD:campusmart}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:campusmart-dev-secret-change-this-in-production-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ai.url=${LM_STUDIO_URL:http://localhost:1234/v1/chat/completions}
app.ai.model=${LM_STUDIO_MODEL:gemma-2b}
app.cors=${CORS_ORIGIN:http://localhost:5173}
